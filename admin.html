<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel - NAZ3 Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    .admin-shell { max-width: 900px; }
    .admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .admin-header h1 { font-size:20px; font-weight:600; }
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px; }
    .stat-card { background:rgba(15,23,42,0.8); border:1px solid var(--border-soft); border-radius:14px; padding:14px; text-align:center; }
    .stat-card .val { font-size:28px; font-weight:700; color:var(--primary); }
    .stat-card .lbl { font-size:11px; color:var(--text-muted); margin-top:3px; }
    .section-title { font-size:14px; font-weight:600; margin-bottom:10px; color:var(--primary-light); }
    .user-table { width:100%; border-collapse:collapse; font-size:12px; }
    .user-table th { text-align:left; padding:8px 10px; color:var(--text-muted); border-bottom:1px solid var(--border-soft); font-weight:500; }
    .user-table td { padding:8px 10px; border-bottom:1px solid rgba(148,163,184,0.15); vertical-align:middle; }
    .user-table tr:last-child td { border-bottom:none; }
    .avatar-sm { width:28px; height:28px; border-radius:999px; background:radial-gradient(circle at 30% 0,#f97316,transparent 60%),#020617; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; margin-right:6px; }
    .coin-input { width:70px; padding:4px 8px; border-radius:8px; border:1px solid var(--border-soft); background:rgba(15,23,42,0.9); color:#fff; font-size:12px; text-align:center; }
    .btn-sm { padding:4px 10px; border-radius:8px; border:none; font-size:11px; font-weight:600; cursor:pointer; transition:0.15s; }
    .btn-save { background:rgba(34,197,94,0.2); color:#86efac; border:1px solid rgba(34,197,94,0.4); }
    .btn-save:hover { background:rgba(34,197,94,0.35); }
    .btn-del { background:rgba(239,68,68,0.2); color:#fca5a5; border:1px solid rgba(239,68,68,0.4); margin-left:4px; }
    .btn-del:hover { background:rgba(239,68,68,0.35); }
    .badge-admin { background:rgba(56,189,248,0.2); color:var(--primary); border:1px solid rgba(56,189,248,0.4); padding:2px 7px; border-radius:999px; font-size:10px; }
    .badge-user { background:rgba(148,163,184,0.15); color:var(--text-muted); padding:2px 7px; border-radius:999px; font-size:10px; }
    .msg { padding:8px 12px; border-radius:10px; font-size:12px; margin-bottom:12px; display:none; }
    .msg.ok { background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.4); color:#86efac; display:block; }
    .msg.err { background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; display:block; }
    .search-bar { width:100%; padding:8px 14px; border-radius:999px; border:1px solid var(--border-soft); background:rgba(15,23,42,0.8); color:#fff; font-size:12px; margin-bottom:14px; }
    .search-bar:focus { outline:none; border-color:var(--primary); }
    .loading { text-align:center; color:var(--text-muted); padding:20px; font-size:13px; }
    .access-denied { text-align:center; padding:40px; color:var(--danger); }
    .access-denied h2 { font-size:22px; margin-bottom:8px; }
    @media(max-width:600px){ .stats-row{grid-template-columns:1fr 1fr;} .user-table th:nth-child(3),.user-table td:nth-child(3){display:none;} }
  </style>
</head>
<body>
  <div class="shell admin-shell">
    <div class="inner">
      <div class="admin-header">
        <div>
          <h1>&#9881; Admin Panel</h1>
          <p style="font-size:11px;color:var(--text-muted)">NAZ3 Game Management</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="coin-chip"><span class="coin-badge">&#8358;</span> <span id="adminCoins">0</span></div>
          <span style="font-size:11px;color:var(--text-muted)" id="adminEmail"></span>
          <button onclick="goHome()" class="secondary-btn" style="width:auto;padding:5px 12px;margin:0;font-size:11px;">&#8592; Home</button>
        </div>
      </div>

      <div id="accessDenied" class="access-denied" style="display:none">
        <h2>&#128274; Access Denied</h2>
        <p style="color:var(--text-muted)">Sirf admin is page ko dekh sakta hai.</p>
        <button onclick="goHome()" class="primary-btn" style="width:auto;margin-top:16px;padding:8px 20px;">Go Home</button>
      </div>

      <div id="adminContent" style="display:none">
        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-card">
            <div class="val" id="statUsers">-</div>
            <div class="lbl">Total Users</div>
          </div>
          <div class="stat-card">
            <div class="val" id="statCoins">-</div>
            <div class="lbl">Total NAZ Coins</div>
          </div>
          <div class="stat-card">
            <div class="val" id="statAvg">-</div>
            <div class="lbl">Avg Coins/User</div>
          </div>
        </div>

        <!-- Message -->
        <div id="adminMsg" class="msg"></div>

        <!-- Users Table -->
        <p class="section-title">&#128101; All Users</p>
        <input class="search-bar" type="text" id="searchInput" placeholder="&#128269; Search by username or email..." oninput="filterUsers()" />
        <div id="tableWrap">
          <div class="loading" id="loadingMsg">Loading users...</div>
          <table class="user-table" id="userTable" style="display:none">
            <thead>
              <tr>
                <th>#</th>
                <th>User</th>
                <th>Email</th>
                <th>Coins</th>
                <th>Role</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="userTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js';
    import { collection, getDocs, doc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js';

    const ADMIN_EMAIL = 'admin@naz3game.com';
    let allUsers = [];

    function showMsg(text, type) {
      const el = document.getElementById('adminMsg');
      el.textContent = text;
      el.className = 'msg ' + type;
      setTimeout(() => el.className = 'msg', 3000);
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = 'index.html';
      document.getElementById('adminEmail').textContent = user.email;

      if (user.email !== ADMIN_EMAIL) {
        document.getElementById('accessDenied').style.display = 'block';
        return;
      }

      document.getElementById('adminContent').style.display = 'block';
      await loadUsers();
    });

    async function loadUsers() {
      try {
        const snap = await getDocs(collection(db, 'users'));
        allUsers = [];
        snap.forEach(d => allUsers.push({ id: d.id, ...d.data() }));
        renderStats();
        renderTable(allUsers);
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('userTable').style.display = 'table';
      } catch (e) {
        document.getElementById('loadingMsg').textContent = 'Error loading users: ' + e.message;
      }
    }

    function renderStats() {
      const total = allUsers.length;
      const totalCoins = allUsers.reduce((s, u) => s + (u.coins || 0), 0);
      const avg = total ? Math.round(totalCoins / total) : 0;
      document.getElementById('statUsers').textContent = total;
      document.getElementById('statCoins').textContent = totalCoins;
      document.getElementById('statAvg').textContent = avg;
      const me = allUsers.find(u => u.email === ADMIN_EMAIL);
      if (me) document.getElementById('adminCoins').textContent = me.coins ?? 0;
    }

    function renderTable(users) {
      const tbody = document.getElementById('userTbody');
      tbody.innerHTML = '';
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:20px">No users found</td></tr>';
        return;
      }
      users.forEach((u, i) => {
        const isAdmin = u.email === ADMIN_EMAIL;
        const name = u.username || u.email?.split('@')[0] || 'User';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:var(--text-muted)">${i + 1}</td>
          <td><span class="avatar-sm">${name.charAt(0).toUpperCase()}</span>${name}</td>
          <td style="color:var(--text-muted);font-size:11px">${u.email || '-'}</td>
          <td><input class="coin-input" id="coin_${u.id}" type="number" value="${u.coins ?? 0}" min="0" /></td>
          <td><span class="${isAdmin ? 'badge-admin' : 'badge-user'}">${isAdmin ? 'Admin' : 'User'}</span></td>
          <td>
            <button class="btn-sm btn-save" onclick="saveCoins('${u.id}')">&#10003; Save</button>
            ${!isAdmin ? `<button class="btn-sm btn-del" onclick="deleteUser('${u.id}','${name}')">&#10005; Del</button>` : ''}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.filterUsers = function() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allUsers.filter(u =>
        (u.username || '').toLowerCase().includes(q) ||
        (u.email || '').toLowerCase().includes(q)
      );
      renderTable(filtered);
    };

    window.saveCoins = async function(uid) {
      const val = parseInt(document.getElementById('coin_' + uid).value);
      if (isNaN(val) || val < 0) return showMsg('Invalid coin value!', 'err');
      try {
        await updateDoc(doc(db, 'users', uid), { coins: val });
        const u = allUsers.find(u => u.id === uid);
        if (u) u.coins = val;
        renderStats();
        showMsg('Coins updated successfully!', 'ok');
      } catch (e) { showMsg('Error: ' + e.message, 'err'); }
    };

    window.deleteUser = async function(uid, name) {
      if (!confirm(`"${name}" ko delete karna chahte ho? Yeh wapis nahi hoga.`)) return;
      try {
        await deleteDoc(doc(db, 'users', uid));
        allUsers = allUsers.filter(u => u.id !== uid);
        renderStats();
        renderTable(allUsers);
        showMsg(`"${name}" deleted successfully.`, 'ok');
      } catch (e) { showMsg('Error: ' + e.message, 'err'); }
    };

    window.goHome = () => window.location.href = 'index.html';
  </script>
</body>
</html>
