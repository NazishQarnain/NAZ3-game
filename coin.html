<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Coin Flip - NAZ3 Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="shell game-shell">
        <header>
            <div class="title-block">
                <h1>Coin Flip</h1>
                <p>Bet 5 NAZ. Heads wins +15.</p>
            </div>
            <div class="user-pill">
                <div id="userAvatar" class="user-avatar">P</div>
                <div class="user-meta">
                    <span id="username">Player</span>
                    <div class="coin-chip"><span class="coin-badge">₦</span> <span id="coinBalance">0</span></div>
                </div>
            </div>
        </header>

        <div class="layout">
            <div class="play-card">
                <div class="coin-display">
                    <div id="coinEmoji" class="coin">🪙</div>
                    <p class="coin-label">Heads wins</p>
                </div>
                <button id="playBtn" class="primary-btn">Flip (5 NAZ)</button>
                <button onclick="goBack()" class="secondary-btn">Back</button>
            </div>

            <div class="rules-card">
                <p class="rules-title">Rules</p>
                <ul class="rules-list">
                    <li>50% Heads / 50% Tails</li>
                    <li>Win: <span class="highlight">+15 NAZ</span></li>
                </ul>
                <div id="result" class="status info">Ready to flip</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js';
        import { doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js';

        const coinSpan = document.getElementById('coinBalance');
        const resultDiv = document.getElementById('result');
        const emoji = document.getElementById('coinEmoji');
        const playBtn = document.getElementById('playBtn');
        let currentUserData = null;
        let userRef = null;

        const setStatus = (text, type = 'info') => {
            resultDiv.textContent = text;
            resultDiv.className = 'status ' + type;
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) return window.location.href = 'index.html';
            userRef = doc(db, 'users', user.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
                currentUserData = snap.data();
                document.getElementById('username').textContent = currentUserData.username || 'Player';
                coinSpan.textContent = currentUserData.coins || 0;
                document.getElementById('userAvatar').textContent = (currentUserData.username || 'P')[0].toUpperCase();
            }
        });

        playBtn.addEventListener('click', async () => {
            if (currentUserData.coins < 5) return setStatus('Not enough coins!', 'lose');
            playBtn.disabled = true;
            emoji.classList.add('spin');
            setStatus('Flipping...', 'info');
            
            try {
                const newCoins = currentUserData.coins - 5;
                await updateDoc(userRef, { coins: newCoins });
                currentUserData.coins = newCoins;
                coinSpan.textContent = newCoins;

                await new Promise(r => setTimeout(r, 800));
                const win = Math.random() < 0.5;
                if (win) {
                    const winTotal = currentUserData.coins + 15;
                    await updateDoc(userRef, { coins: winTotal });
                    currentUserData.coins = winTotal;
                    coinSpan.textContent = winTotal;
                    emoji.textContent = '🙂';
                    setStatus('Heads! Won +15', 'win');
                } else {
                    emoji.textContent = '😵';
                    setStatus('Tails! Lost 5', 'lose');
                }
            } finally {
                playBtn.disabled = false;
                emoji.classList.remove('spin');
            }
        });
        window.goBack = () => location.href = 'index.html';
    </script>
</body>
</html>
