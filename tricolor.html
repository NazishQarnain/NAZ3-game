<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Prediction - NAZ3 Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Predict the next color and win rewards in NAZ3 Game." />
  <link rel="stylesheet" href="style.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div class="mobile-app-shell color-page-shell">
    <header class="mobile-topbar color-topbar">
      <div class="topbar-left">
        <button class="icon-btn" type="button" onclick="location.href='index.html'" aria-label="Back">‹</button>
        <div class="brand brand-inline">
          <div class="brand-mark">N</div>
          <div class="brand-title-wrap">
            <h1>NAZ3-GAME</h1>
            <span>Color Prediction</span>
          </div>
        </div>
      </div>

      <div class="topbar-right">
        <button class="wallet-pill" type="button">
          <span class="wallet-icon">💳</span>
          <span id="walletBalance">₹ 0.00</span>
          <span class="wallet-plus">+</span>
        </button>
        <button class="icon-btn" type="button" aria-label="History">⟲</button>
      </div>
    </header>

    <main class="app-main color-prediction-page">
      <section class="section-head compact-head">
        <h3>COLOR PREDICTION</h3>
        <button class="view-all-btn" type="button">How to play?</button>
      </section>

      <section class="prediction-panel">
        <div class="period-box">
          <div>
            <span class="muted-label">Period</span>
            <div class="period-row">
              <strong id="periodNumber">20240527000156</strong>
              <button class="copy-btn" id="copyPeriodBtn" type="button">⧉</button>
            </div>
          </div>

          <div class="timer-box">
            <span class="muted-label">Time Remaining</span>
            <strong id="timerText">00 : 26</strong>
          </div>
        </div>

        <div class="result-strip">
          <div id="recentDots" class="recent-dots"></div>
          <button class="view-all-btn" type="button">View All →</button>
        </div>
      </section>

      <section class="predict-section">
        <h4>Predict the next color</h4>

        <div class="predict-options">
          <button class="predict-color-card orange active" type="button" data-color="orange">
            <span class="predict-orb"></span>
            <span class="predict-label">Orange</span>
          </button>

          <button class="predict-color-card white" type="button" data-color="white">
            <span class="predict-orb"></span>
            <span class="predict-label">White</span>
          </button>

          <button class="predict-color-card green" type="button" data-color="green">
            <span class="predict-orb"></span>
            <span class="predict-label">Green</span>
          </button>
        </div>
      </section>

      <section class="bet-panel">
        <div class="bet-topline">
          <div>
            <span class="muted-label">Bet Amount</span>
          </div>
          <div class="available-balance">
            Available Balance: <strong id="availableBalance">₹ 0.00</strong>
          </div>
        </div>

        <div class="bet-controls">
          <div class="amount-input-wrap">
            <span>₹</span>
            <input type="number" id="betAmount" min="1" placeholder="Enter amount" value="50" />
          </div>

          <button class="amount-chip dark" type="button" id="clearBetBtn">Clear</button>
          <button class="amount-chip" type="button" data-add="10">+10</button>
          <button class="amount-chip" type="button" data-add="50">+50</button>
          <button class="amount-chip" type="button" data-add="100">+100</button>
          <button class="amount-chip" type="button" data-add="500">+500</button>
        </div>
      </section>

      <section class="multiplier-panel">
        <div class="section-mini-head">Win Multiplier</div>

        <div class="multiplier-grid">
          <div class="multiplier-box">
            <span class="dot orange"></span>
            <small>Orange</small>
            <strong>2.00x</strong>
          </div>

          <div class="multiplier-box">
            <span class="dot white"></span>
            <small>White</small>
            <strong>2.00x</strong>
          </div>

          <div class="multiplier-box">
            <span class="dot green"></span>
            <small>Green</small>
            <strong>2.00x</strong>
          </div>
        </div>

        <button id="placeBetBtn" class="place-bet-btn" type="button">PLACE BET</button>

        <div id="betStatus" class="secure-line">🛡 Fair Game • 100% Secure</div>
      </section>

      <section class="prediction-panel">
        <div class="section-head small-section-head">
          <h3>Recent Results</h3>
          <button class="view-all-btn" type="button">View All →</button>
        </div>

        <div id="recentResultRow" class="recent-result-row"></div>
      </section>

      <section class="history-panel">
        <div class="history-tabs">
          <button class="history-tab active" type="button">Game History</button>
          <button class="history-tab" type="button">My Bets</button>
        </div>

        <div class="history-table-wrap">
          <table class="history-table">
            <thead>
              <tr>
                <th>Period</th>
                <th>Color</th>
                <th>Bet</th>
                <th>Multiplier</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { watchAuth } from './auth.js';
    import { db } from './firebase-config.js';
    import {
      doc,
      onSnapshot,
      updateDoc
    } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js';

    const walletBalance = document.getElementById('walletBalance');
    const availableBalance = document.getElementById('availableBalance');
    const periodNumber = document.getElementById('periodNumber');
    const timerText = document.getElementById('timerText');
    const recentDots = document.getElementById('recentDots');
    const recentResultRow = document.getElementById('recentResultRow');
    const historyTableBody = document.getElementById('historyTableBody');
    const betAmount = document.getElementById('betAmount');
    const betStatus = document.getElementById('betStatus');
    const placeBetBtn = document.getElementById('placeBetBtn');

    let currentUser = null;
    let currentUserData = null;
    let userRef = null;
    let selectedColor = 'orange';
    let placedForPeriod = false;
    let activePeriod = '';
    let currentResultHistory = ['green', 'white', 'orange', 'green', 'white', 'orange', 'green', 'white', 'green', 'orange'];
    let myHistory = [];

    function formatMoney(value) {
      return `₹ ${Number(value || 0).toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;
    }

    function setBalance(coins) {
      walletBalance.textContent = formatMoney(coins);
      availableBalance.textContent = formatMoney(coins);
    }

    function setStatus(message, type = 'normal') {
      betStatus.textContent = message;
      betStatus.className = `secure-line ${type}`;
    }

    function getCurrentPeriod() {
      const now = new Date();
      return `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, '0')}${String(now.getUTCDate()).padStart(2, '0')}${String(now.getUTCHours()).padStart(2, '0')}${String(now.getUTCMinutes()).padStart(2, '0')}`;
    }

    function getRemainingSeconds() {
      const now = new Date();
      return 60 - now.getUTCSeconds();
    }

    function getWinningColor(period) {
      const seed = [...period].reduce((sum, ch) => sum + Number(ch), 0);
      const colors = ['orange', 'white', 'green'];
      return colors[seed % colors.length];
    }

    function renderRecentDots() {
      recentDots.innerHTML = currentResultHistory.map((color) =>
        `<span class="dot ${color}"></span>`
      ).join('');
    }

    function renderRecentResultRow() {
      recentResultRow.innerHTML = currentResultHistory.map((color, index) => `
        <div class="result-ball-wrap">
          <span class="dot ${color} lg"></span>
          <small>${index}</small>
        </div>
      `).join('');
    }

    function renderHistory() {
      if (!myHistory.length) {
        historyTableBody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align:center;color:#94a3b8;">No bets placed yet.</td>
          </tr>
        `;
        return;
      }

      historyTableBody.innerHTML = myHistory.slice().reverse().map((item) => `
        <tr>
          <td>${item.period}</td>
          <td><span class="dot ${item.color}"></span></td>
          <td>₹ ${item.bet}</td>
          <td>2.00x</td>
          <td class="${item.result === 'Won' ? 'won-text' : 'lost-text'}">${item.result}</td>
        </tr>
      `).join('');
    }

    function syncPeriodUI() {
      activePeriod = getCurrentPeriod();
      periodNumber.textContent = activePeriod;

      const secs = getRemainingSeconds();
      timerText.textContent = `00 : ${String(secs).padStart(2, '0')}`;

      if (secs <= 10 && !placedForPeriod) {
        setStatus('Betting closes in the last 10 seconds. Hurry up.', 'warning');
      } else if (!placedForPeriod) {
        setStatus('🛡 Fair Game • 100% Secure', 'normal');
      }
    }

    function handlePeriodRollover() {
      const latestPeriod = getCurrentPeriod();

      if (latestPeriod !== activePeriod) {
        const previousPeriod = activePeriod;
        activePeriod = latestPeriod;
        periodNumber.textContent = activePeriod;

        if (placedForPeriod && myHistory.length) {
          const lastBet = myHistory[myHistory.length - 1];
          if (lastBet.period === previousPeriod && lastBet.result === 'Pending') {
            const winningColor = getWinningColor(previousPeriod);
            const didWin = lastBet.color === winningColor;
            lastBet.result = didWin ? 'Won' : 'Lost';

            if (didWin && userRef && currentUserData) {
              const updated = Number(currentUserData.coins || 0) + (lastBet.bet * 2);
              updateDoc(userRef, { coins: updated });
            }

            currentResultHistory = [winningColor, ...currentResultHistory].slice(0, 10);
            renderRecentDots();
            renderRecentResultRow();
            renderHistory();
          }
        }

        placedForPeriod = false;
        setStatus('🛡 Fair Game • 100% Secure', 'normal');
      }
    }

    async function placeBet() {
      if (!currentUserData || !userRef) {
        setStatus('Please login first.', 'warning');
        return;
      }

      const secs = getRemainingSeconds();
      const amount = Math.max(1, Number(betAmount.value) || 0);

      if (secs <= 10) {
        setStatus('Betting is closed for this round.', 'warning');
        return;
      }

      if (placedForPeriod) {
        setStatus('You already placed a bet for this period.', 'warning');
        return;
      }

      if (!amount || amount < 1) {
        setStatus('Please enter a valid bet amount.', 'warning');
        return;
      }

      if (amount > Number(currentUserData.coins || 0)) {
        setStatus('Not enough balance.', 'warning');
        return;
      }

      const updatedCoins = Number(currentUserData.coins || 0) - amount;

      try {
        await updateDoc(userRef, { coins: updatedCoins });

        myHistory.push({
          period: activePeriod,
          color: selectedColor,
          bet: amount,
          result: 'Pending'
        });

        placedForPeriod = true;
        setStatus(`Bet placed on ${selectedColor.toUpperCase()} for ₹ ${amount}.`, 'success');
        renderHistory();
      } catch (e) {
        setStatus(e.message || 'Failed to place bet.', 'warning');
      }
    }

    document.querySelectorAll('.predict-color-card').forEach((btn) => {
      btn.addEventListener('click', () => {
        selectedColor = btn.dataset.color;
        document.querySelectorAll('.predict-color-card').forEach((item) => item.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    document.querySelectorAll('[data-add]').forEach((btn) => {
      btn.addEventListener('click', () => {
        betAmount.value = Number(betAmount.value || 0) + Number(btn.dataset.add);
      });
    });

    document.getElementById('clearBetBtn').addEventListener('click', () => {
      betAmount.value = '';
    });

    document.getElementById('copyPeriodBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(periodNumber.textContent);
        setStatus('Period copied.', 'success');
      } catch {
        setStatus('Copy failed.', 'warning');
      }
    });

    placeBetBtn.addEventListener('click', placeBet);

    watchAuth(
      (userData, ref) => {
        currentUser = userData;
        currentUserData = userData;
        userRef = ref || doc(db, 'users', userData.uid);

        onSnapshot(userRef, (snap) => {
          if (!snap.exists()) return;
          currentUserData = { uid: userData.uid, ...snap.data() };
          setBalance(currentUserData.coins || 0);
        });
      },
      () => {
        location.href = 'index.html';
      }
    );

    setInterval(() => {
      syncPeriodUI();
      handlePeriodRollover();
    }, 1000);

    renderRecentDots();
    renderRecentResultRow();
    renderHistory();
    syncPeriodUI();
  </script>
</body>
</html>
