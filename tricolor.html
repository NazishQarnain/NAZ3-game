<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri-Color - NAZ3 Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 90%; max-width: 800px; background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .user-info { background: #f5f5f5; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .coin-balance { font-size: 24px; font-weight: bold; color: #667eea; }
        .btn { padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .game-area { padding: 40px; text-align: center; }
        .color-wheel { width: 300px; height: 300px; margin: 30px auto; border-radius: 50%; background: conic-gradient(from 0deg, #FF9933 0deg 120deg, #FFFFFF 120deg 240deg, #138808 240deg 360deg); position: relative; border: 5px solid white; transition: transform 4s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        .wheel-arrow { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #FF4444; z-index: 10; }
        .color-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }
        .color-btn { padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; color: white; }
        .color-btn.orange { background: #FF9933; }
        .color-btn.white { background: #FFFFFF; color: #333; border: 1px solid #ddd; }
        .color-btn.green { background: #138808; }
        .timer-container { margin: 20px 0; font-size: 24px; font-weight: bold; color: #764ba2; }
        .betting-status { margin: 10px 0; font-size: 18px; font-weight: 600; }
        .result { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>🇮🇳 Live Tri-Color</h1><p>Every minute a new result!</p></div>
    <div class="user-info">
        <div><h3>Welcome, <span id="username">Player</span>!</h3></div>
        <div class="coin-balance">💰 <span id="coinBalance">0</span> NAZ</div>
        <button class="btn btn-secondary" onclick="location.href='index.html'">Back</button>
    </div>
    <div class="game-area">
        <div class="timer-container">Next Result in: <span id="timer">00:00</span></div>
        <div id="status" class="betting-status">Waiting for round...</div>
        <div style="position: relative; display: inline-block;">
            <div id="colorWheel" class="color-wheel"></div>
            <div class="wheel-arrow"></div>
        </div>
        <div class="color-buttons" id="betButtons">
            <button class="color-btn orange" onclick="placeBet('orange')">🟠 Orange</button>
            <button class="color-btn white" onclick="placeBet('white')">⚪ White</button>
            <button class="color-btn green" onclick="placeBet('green')">🟢 Green</button>
        </div>
        <div id="gameResult"></div>
        <div id="myBet" style="margin-top:10px; font-weight:bold;"></div>
    </div>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { doc, getDoc, setDoc, updateDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    let user = null;
    let userData = null;
    let currentBet = null;
    let hasBetThisRound = false;

    onAuthStateChanged(auth, async (u) => {
        if (!u) { window.location.href = 'index.html'; return; }
        user = u;
        onSnapshot(doc(db, 'users', user.uid), (snap) => {
            if (snap.exists()) {
                userData = snap.data();
                document.getElementById('username').textContent = userData.username || user.email;
                document.getElementById('coinBalance').textContent = userData.coins || 0;
            }
        });
    });

    // Sync with server time and 1-minute cycles
    function updateGame() {
        const now = new Date();
        const seconds = now.getSeconds();
        const timeLeft = 60 - seconds;
        
        document.getElementById('timer').textContent = `00:${timeLeft.toString().padStart(2, '0')}`;
        
        const statusEl = document.getElementById('status');
        const buttons = document.querySelectorAll('.color-btn');
        const wheel = document.getElementById('colorWheel');

        if (seconds < 30) {
            statusEl.textContent = "Betting Phase: Place your bets!";
            statusEl.style.color = "green";
            buttons.forEach(b => b.disabled = false);
            if (seconds === 0) {
                hasBetThisRound = false;
                document.getElementById('myBet').textContent = "";
                document.getElementById('gameResult').textContent = "";
                wheel.style.transition = "none";
                wheel.style.transform = "rotate(0deg)";
            }
        } else if (seconds < 40) {
            statusEl.textContent = "Bets Closed! Generating Result...";
            statusEl.style.color = "orange";
            buttons.forEach(b => b.disabled = true);
            if (seconds === 30) { processResult(); }
        } else {
            statusEl.textContent = "Result Announced! Next round soon.";
            statusEl.style.color = "blue";
            buttons.forEach(b => b.disabled = true);
        }
    }

    async function processResult() {
        const now = new Date();
        const minute = now.getMinutes();
        const hour = now.getHours();
        const seed = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${hour}-${minute}`;
        
        // Deterministic result for all users
        const colors = ['orange', 'white', 'green'];
        const hash = Array.from(seed).reduce((a, b) => { a = ((a << 5) - a) + b.charCodeAt(0); return a & a; }, 0);
        const winningIndex = Math.abs(hash) % 3;
        const winningColor = colors[winningIndex];
        
        const wheel = document.getElementById('colorWheel');
        const angles = { 'orange': 60, 'white': 180, 'green': 300 };
        const baseRotation = 3600; // 10 full spins
        wheel.style.transition = "transform 4s cubic-bezier(0.17, 0.67, 0.83, 0.67)";
        wheel.style.transform = `rotate(${baseRotation + (360 - angles[winningColor])}deg)`;

        setTimeout(async () => {
            const resultDiv = document.getElementById('gameResult');
            if (currentBet === winningColor) {
                const newCoins = (userData.coins || 0) + 30;
                await updateDoc(doc(db, 'users', user.uid), { coins: newCoins });
                resultDiv.innerHTML = `<div class="result" style="color:green">🎉 WON! +30 Coins</div>`;
            } else if (currentBet) {
                resultDiv.innerHTML = `<div class="result" style="color:red">😢 LOST! Result was ${winningColor}</div>`;
            } else {
                resultDiv.innerHTML = `<div class="result">Result: ${winningColor}</div>`;
            }
            currentBet = null;
        }, 4500);
    }

    window.placeBet = async (color) => {
        if (hasBetThisRound) { alert("Already bet!"); return; }
        if (!userData || userData.coins < 15) { alert("Not enough coins!"); return; }
        
        hasBetThisRound = true;
        currentBet = color;
        const newCoins = userData.coins - 15;
        await updateDoc(doc(db, 'users', user.uid), { coins: newCoins });
        document.getElementById('myBet').textContent = `Your Bet: ${color.toUpperCase()}`;
    };

    setInterval(updateGame, 1000);
    updateGame();
</script>
</body>
</html>
