<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri-Color - NAZ3 Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .user-info {
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .coin-balance {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .game-area {
            padding: 40px;
            text-align: center;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            margin: 30px auto;
        }

        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #667eea;
            z-index: 10;
        }

        .color-wheel {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #FF9933 0deg 120deg,
                #FFFFFF 120deg 240deg,
                #138808 240deg 360deg
            );
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: spin 3s linear infinite;
        }

        .color-wheel.spinning {
            animation: spin 0.5s linear infinite;
        }

        .color-wheel.stopped {
            animation: none;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .color-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .color-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .color-btn.orange {
            background: linear-gradient(135deg, #FF9933, #FF7700);
        }

        .color-btn.yellow {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }

        .color-btn.green {
            background: linear-gradient(135deg, #138808, #0d5c05);
        }

        .color-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .color-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
        }

        .result.win {
            background: #d4edda;
            color: #155724;
        }

        .result.lose {
            background: #f8d7da;
            color: #721c24;
        }

        .info-text {
            color: #666;
            margin: 20px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇮🇳 Tri-Color Game</h1>
            <p>Bet 15 coins, win 30!</p>
        </div>

        <div class="user-info">
            <div>
                <h3>Welcome, <span id="username">Player</span>!</h3>
            </div>
            <div class="coin-balance">
                💰 <span id="coinBalance">100</span> NAZ Coins
            </div>
            <button class="btn btn-secondary" onclick="goBack()">Back to Games</button>
        </div>

        <div class="game-area">
            <p class="info-text">Choose your color and spin the wheel!</p>
            
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <div id="colorWheel" class="color-wheel"></div>
            </div>
            
            <div class="color-buttons">
                <button class="color-btn orange" onclick="selectColor('orange')">🟠 Orange</button>
                <button class="color-btn yellow" onclick="selectColor('yellow')">🟡 Yellow</button>
                <button class="color-btn green" onclick="selectColor('green')">🟢 Green</button>
            </div>
            
            <div id="gameResult"></div>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('naz3Users')) || {};
        let currentUser = localStorage.getItem('naz3CurrentUser');
        let selectedColor = null;

        if (!currentUser || !users[currentUser]) {
            alert('Please login first!');
            window.location.href = 'index.html';
        }

        function updateUserInfo() {
            if (currentUser && users[currentUser]) {
                document.getElementById('username').textContent = currentUser;
                document.getElementById('coinBalance').textContent = users[currentUser].coins;
            }
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function selectColor(color) {
            if (users[currentUser].coins < 15) {
                alert('Not enough coins! You need 15 NAZ coins to play.');
                return;
            }

            selectedColor = color;
            const wheel = document.getElementById('colorWheel');
            const buttons = document.querySelectorAll('.color-btn');
            const resultDiv = document.getElementById('gameResult');

            // Disable buttons
            buttons.forEach(btn => btn.disabled = true);

            // Deduct bet
            users[currentUser].coins -= 15;
            updateUserInfo();

            // Spin animation
            wheel.classList.add('spinning');
            resultDiv.innerHTML = '';

            setTimeout(() => {
                wheel.classList.remove('spinning');
                wheel.classList.add('stopped');

                // Determine winner
                const colors = ['orange', 'yellow', 'green'];
                const winningColor = colors[Math.floor(Math.random() * colors.length)];
                const won = (selectedColor === winningColor);

                setTimeout(() => {
                    if (won) {
                        users[currentUser].coins += 30;
                        resultDiv.innerHTML = `<div class="result win">🎉 You Won! Your ${selectedColor} matched! +30 NAZ Coins!</div>`;
                    } else {
                        resultDiv.innerHTML = `<div class="result lose">😢 You Lost! Winning color was ${winningColor}. -15 NAZ Coins. Try again!</div>`;
                    }

                    localStorage.setItem('naz3Users', JSON.stringify(users));
                    updateUserInfo();

                    setTimeout(() => {
                        resultDiv.innerHTML = '';
                        wheel.classList.remove('stopped');
                    }, 3000);

                    buttons.forEach(btn => btn.disabled = false);
                }, 1000);
            }, 2000);
        }

        updateUserInfo();
    </script>
</body>
</html>
