<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Prediction - NAZ3 Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="mobile-app-shell color-page-shell">
    <header class="mobile-topbar color-topbar">
      <div class="topbar-left">
        <button class="icon-btn" type="button" onclick="location.href='index.html'">‹</button>
        <div class="brand brand-inline">
          <div class="brand-mark">N</div>
          <div class="brand-title-wrap">
            <h1>NAZ3-GAME</h1>
            <span>Color Prediction</span>
          </div>
        </div>
      </div>

      <div class="topbar-right">
        <button class="wallet-pill" type="button">
          <span class="wallet-icon">💳</span>
          <span id="walletBalance">₹ 0.00</span>
          <span class="wallet-plus">+</span>
        </button>
        <button class="icon-btn" type="button" id="refreshBtn">⟲</button>
      </div>
    </header>

    <main class="app-main color-prediction-page">
      <section class="section-head compact-head">
        <h3>COLOR PREDICTION</h3>
        <button class="view-all-btn" type="button">How to play?</button>
      </section>

      <section class="prediction-panel">
        <div class="period-box">
          <div>
            <span class="muted-label">Live Result</span>
            <div class="period-row">
              <strong id="liveResultText">WAITING</strong>
            </div>
          </div>

          <div class="timer-box">
            <span class="muted-label">Time Remaining</span>
            <strong id="timerText">00 : 00</strong>
          </div>
        </div>

        <div class="result-strip">
          <div id="recentDots" class="recent-dots"></div>
          <button class="view-all-btn" type="button">Live</button>
        </div>
      </section>

      <section class="predict-section">
        <h4>Predict the next color</h4>

        <div class="predict-options">
          <button class="predict-color-card orange active" type="button" data-color="orange">
            <span class="predict-orb"></span>
            <span class="predict-label">Orange</span>
          </button>

          <button class="predict-color-card white" type="button" data-color="white">
            <span class="predict-orb"></span>
            <span class="predict-label">White</span>
          </button>

          <button class="predict-color-card green" type="button" data-color="green">
            <span class="predict-orb"></span>
            <span class="predict-label">Green</span>
          </button>
        </div>
      </section>

      <section class="bet-panel">
        <div class="bet-topline">
          <div><span class="muted-label">Bet Amount</span></div>
          <div class="available-balance">
            Available Balance: <strong id="availableBalance">₹ 0.00</strong>
          </div>
        </div>

        <div class="bet-controls">
          <div class="amount-input-wrap">
            <span>₹</span>
            <input type="number" id="betAmount" min="1" placeholder="Enter amount" value="50" />
          </div>
          <button class="amount-chip dark" type="button" id="clearBetBtn">Clear</button>
          <button class="amount-chip" type="button" data-add="10">+10</button>
          <button class="amount-chip" type="button" data-add="50">+50</button>
          <button class="amount-chip" type="button" data-add="100">+100</button>
          <button class="amount-chip" type="button" data-add="500">+500</button>
        </div>
      </section>

      <section class="multiplier-panel">
        <div class="section-mini-head">Win Multiplier</div>

        <div class="multiplier-grid">
          <div class="multiplier-box">
            <span class="dot orange"></span>
            <small>Orange</small>
            <strong>2.00x</strong>
          </div>
          <div class="multiplier-box">
            <span class="dot white"></span>
            <small>White</small>
            <strong>2.00x</strong>
          </div>
          <div class="multiplier-box">
            <span class="dot green"></span>
            <small>Green</small>
            <strong>2.00x</strong>
          </div>
        </div>

        <button id="placeBetBtn" class="place-bet-btn" type="button">PLACE BET</button>
        <div id="betStatus" class="secure-line">🛡 Fair Game • 100% Secure</div>
      </section>

      <section class="prediction-panel">
        <div class="section-head small-section-head">
          <h3>Recent Results</h3>
          <button class="view-all-btn" type="button">Live</button>
        </div>
        <div id="recentResultRow" class="recent-result-row"></div>
      </section>

      <section class="history-panel">
        <div class="history-tabs">
          <button class="history-tab active" type="button">My Bets</button>
          <button class="history-tab" type="button">Live Game</button>
        </div>

        <div class="history-table-wrap">
          <table class="history-table">
            <thead>
              <tr>
                <th>Color</th>
                <th>Bet</th>
                <th>Multiplier</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js';
    import {
      getAuth,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js';
    import {
      getFirestore,
      doc,
      getDoc,
      onSnapshot,
      updateDoc,
      addDoc,
      collection,
      serverTimestamp,
      query,
      where,
      getDocs
    } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyB9wB0iA4N5WQEM08AmONMSZsxqZ1niC0Y",
      authDomain: "naz3-game.firebaseapp.com",
      projectId: "naz3-game",
      storageBucket: "naz3-game.firebasestorage.app",
      messagingSenderId: "97109882574",
      appId: "1:97109882574:web:3733493a188f80a60639db",
      measurementId: "G-MDMES4P1LS"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const walletBalance = document.getElementById('walletBalance');
    const availableBalance = document.getElementById('availableBalance');
    const liveResultText = document.getElementById('liveResultText');
    const timerText = document.getElementById('timerText');
    const recentDots = document.getElementById('recentDots');
    const recentResultRow = document.getElementById('recentResultRow');
    const historyTableBody = document.getElementById('historyTableBody');
    const betAmount = document.getElementById('betAmount');
    const betStatus = document.getElementById('betStatus');
    const placeBetBtn = document.getElementById('placeBetBtn');
    const gameRef = doc(db, 'gameState', 'tricolor');

    let currentUser = null;
    let currentUserData = null;
    let currentRound = null;
    let timerId = null;
    let selectedColor = 'orange';

    function formatMoney(value) {
      return `₹ ${Number(value || 0).toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;
    }

    function setStatus(message, type = 'normal') {
      betStatus.textContent = message;
      betStatus.className = `secure-line ${type}`;
    }

    function setBalance(coins) {
      walletBalance.textContent = formatMoney(coins);
      availableBalance.textContent = formatMoney(coins);
    }

    function renderResults(list = []) {
      recentDots.innerHTML = list.slice(0, 10).map((color) => `<span class="dot ${color}"></span>`).join('');
      recentResultRow.innerHTML = list.slice(0, 10).map((color, i) => `
        <div class="result-ball-wrap">
          <span class="dot ${color} lg"></span>
          <small>${i}</small>
        </div>
      `).join('');
    }

    function updateLiveResult(result) {
      liveResultText.textContent = (result || 'WAITING').toUpperCase();
      liveResultText.style.color =
        result === 'green' ? '#2fff63' :
        result === 'orange' ? '#ff8d1b' :
        result === 'white' ? '#ffffff' : '#f8fafc';
    }

    function startTimer(endsAt) {
      clearInterval(timerId);

      function tick() {
        const left = Math.max(0, Math.floor((Number(endsAt || 0) - Date.now()) / 1000));
        timerText.textContent = `00 : ${String(left).padStart(2, '0')}`;

        if (!currentRound || currentRound.status !== 'open' || left <= 10) {
          setStatus('Betting closes in the last 10 seconds. Hurry up.', 'warning');
        } else {
          setStatus('🛡 Fair Game • 100% Secure', 'normal');
        }
      }

      tick();
      timerId = setInterval(tick, 1000);
    }

    async function loadUser(uid) {
      const userRef = doc(db, 'users', uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        setStatus('User profile not found.', 'warning');
        return;
      }

      currentUserData = { uid, ...userSnap.data() };
      setBalance(currentUserData.coins || 0);

      onSnapshot(userRef, (snap) => {
        if (!snap.exists()) return;
        currentUserData = { uid, ...snap.data() };
        setBalance(currentUserData.coins || 0);
        renderMyBets();
      });

      renderMyBets();
    }

    async function renderMyBets() {
      if (!currentUser?.uid) {
        historyTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#94a3b8;">Login required.</td></tr>`;
        return;
      }

      const q = query(
        collection(db, 'tricolorBets'),
        where('uid', '==', currentUser.uid)
      );

      const snap = await getDocs(q);
      const rows = [];
      snap.forEach((d) => rows.push(d.data()));
      rows.sort((a, b) => Number(b.createdAt?.seconds || 0) - Number(a.createdAt?.seconds || 0));

      if (!rows.length) {
        historyTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#94a3b8;">No bets placed yet.</td></tr>`;
        return;
      }

      historyTableBody.innerHTML = rows.slice(0, 10).map((item) => `
        <tr>
          <td><span class="dot ${item.color}"></span></td>
          <td>₹ ${item.bet}</td>
          <td>${Number(item.multiplier || 2).toFixed(2)}x</td>
          <td class="${item.result === 'Won' ? 'won-text' : item.result === 'Lost' ? 'lost-text' : ''}">
            ${item.result || 'Pending'}
          </td>
        </tr>
      `).join('');
    }

    onSnapshot(gameRef, (snap) => {
      if (!snap.exists()) {
        liveResultText.textContent = 'WAITING';
        timerText.textContent = '00 : 00';
        setStatus('Game state not available.', 'warning');
        return;
      }

      currentRound = snap.data();
      updateLiveResult(currentRound.currentResult || '');
      renderResults(currentRound.lastResults || []);
      startTimer(currentRound.endsAt || 0);
    });

    document.querySelectorAll('.predict-color-card').forEach((btn) => {
      btn.addEventListener('click', () => {
        selectedColor = btn.dataset.color;
        document.querySelectorAll('.predict-color-card').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    document.querySelectorAll('[data-add]').forEach((btn) => {
      btn.addEventListener('click', () => {
        betAmount.value = Number(betAmount.value || 0) + Number(btn.dataset.add);
      });
    });

    document.getElementById('clearBetBtn').addEventListener('click', () => {
      betAmount.value = '';
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      location.reload();
    });

    placeBetBtn.addEventListener('click', async () => {
      if (!currentUser || !currentUserData) {
        setStatus('Please login first.', 'warning');
        return;
      }

      if (!currentRound || currentRound.status !== 'open') {
        setStatus('Round is closed.', 'warning');
        return;
      }

      const left = Math.max(0, Math.floor((Number(currentRound.endsAt || 0) - Date.now()) / 1000));
      if (left <= 10) {
        setStatus('Betting is closed for this round.', 'warning');
        return;
      }

      const amount = Math.max(1, Number(betAmount.value) || 0);
      if (!amount) {
        setStatus('Enter a valid amount.', 'warning');
        return;
      }

      if (amount > Number(currentUserData.coins || 0)) {
        setStatus('Not enough balance.', 'warning');
        return;
      }

      await updateDoc(doc(db, 'users', currentUser.uid), {
        coins: Number(currentUserData.coins || 0) - amount
      });

      await addDoc(collection(db, 'tricolorBets'), {
        uid: currentUser.uid,
        username: currentUserData.username || 'Player',
        color: selectedColor,
        bet: amount,
        multiplier: 2,
        result: 'Pending',
        createdAt: serverTimestamp()
      });

      setStatus(`Bet placed on ${selectedColor.toUpperCase()} for ₹ ${amount}.`, 'success');
      renderMyBets();
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = 'index.html';
        return;
      }

      currentUser = user;
      await loadUser(user.uid);
    });
  </script>
</body>
</html>
