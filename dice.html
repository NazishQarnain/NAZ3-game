<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Dice Roll - NAZ3 Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="shell game-shell">
        <header>
            <div class="title-block">
                <h1>Dice Roll</h1>
            <p>Bet <span id="betDesc">10</span> NAZ. Roll 4+ to win +<span id="winDesc">30</span>.</p>
            <div class="bet-input-group">
              <label for="betAmount">Bet Amount:</label>
              <input type="number" id="betAmount" min="1" value="10" />
              <span>NAZ</span>
            </div>            </div>
            <div class="user-pill">
                <div id="userAvatar" class="user-avatar">P</div>
                <div class="user-meta">
                    <span id="username">Player</span>
                    <div class="coin-chip"><span class="coin-badge">₦</span> <span id="coinBalance">0</span></div>
                </div>
            </div>
        </header>

        <div class="layout">
            <div class="play-card">
                <div class="dice-display">
                    <div id="dice" class="dice">
                        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                    </div>
                    <p id="diceLabel" class="dice-label">Click roll</p>
                </div>
          <button id="playBtn" class="primary-btn">Roll (<span id="betDisplay">10</span> NAZ)</button>                <button onclick="goBack()" class="secondary-btn">Back</button>
            </div>

            <div class="rules-card">
                <p class="rules-title">Rules</p>
                <ul class="rules-list">
                    <li>Roll 4, 5, or 6 to win</li>
              <li>Win: <span class="highlight">+<span id="winRule">30</span> NAZ</span></li>                </ul>
                <div id="result" class="status info">Ready to roll</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js';
        import { doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js';

        const diceEl = document.getElementById('dice');
        const pips = Array.from(diceEl.querySelectorAll('.pip'));
        const coinSpan = document.getElementById('coinBalance');
        const resultDiv = document.getElementById('result');
        const playBtn = document.getElementById('playBtn');
        let currentUserData = null;
        let userRef = null;
          const betInput = document.getElementById('betAmount');
  const betDisplay = document.getElementById('betDisplay');
  const betDesc = document.getElementById('betDesc');
  const winDesc = document.getElementById('winDesc');
  const winRule = document.getElementById('winRule');

  function updateBetDisplay() {
    const bet = parseInt(betInput.value) || 10;
    const win = bet * 3;
    betDisplay.textContent = bet;
    betDesc.textContent = bet;
    winDesc.textContent = win;
    winRule.textContent = win;
  }

  betInput.addEventListener('input', updateBetDisplay);
  updateBetDisplay();

        const showDice = (val) => {
            pips.forEach(p => p.classList.remove('on'));
            const map = { 1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9] };
            (map[val] || []).forEach(i => pips[i-1].classList.add('on'));
            document.getElementById('diceLabel').textContent = 'Rolled: ' + val;
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) return window.location.href = 'index.html';
            userRef = doc(db, 'users', user.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
                currentUserData = snap.data();
                document.getElementById('username').textContent = currentUserData.username || 'Player';
                coinSpan.textContent = currentUserData.coins || 0;
                document.getElementById('userAvatar').textContent = (currentUserData.username || 'P')[0].toUpperCase();
            }
        });

        playBtn.addEventListener('click', async () => {
    const betAmount = parseInt(betInput.value) || 10;
    if (currentUserData.coins < betAmount) return;            playBtn.disabled = true;
            diceEl.classList.add('roll');
            
    const newCoins = currentUserData.coins - betAmount;            await updateDoc(userRef, { coins: newCoins });
            currentUserData.coins = newCoins;
            coinSpan.textContent = newCoins;

            setTimeout(async () => {
                const roll = Math.floor(Math.random() * 6) + 1;
                showDice(roll);
                if (roll >= 4) {
        const winTotal = currentUserData.coins + (betAmount * 3);                    await updateDoc(userRef, { coins: winTotal });
                    currentUserData.coins = winTotal;
                    coinSpan.textContent = winTotal;
        resultDiv.textContent = 'Win! +' + (betAmount * 3);                    resultDiv.className = 'status win';
                } else {
        resultDiv.textContent = 'Lost ' + betAmount;                    resultDiv.className = 'status lose';
                }
                playBtn.disabled = false;
                diceEl.classList.remove('roll');
            }, 800);
        });
        window.goBack = () => location.href = 'index.html';
    </script>
</body>
</html>
